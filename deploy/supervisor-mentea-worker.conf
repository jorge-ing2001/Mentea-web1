; Copiar a /etc/supervisor/conf.d/mentea-worker.conf
; sudo supervisorctl reread && sudo supervisorctl update

[program:mentea-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mentea/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/mentea/storage/logs/worker.log
stopwaitsecs=3600
