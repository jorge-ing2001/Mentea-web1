# Render Blueprint for Mentea (Laravel + PostgreSQL)
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions a Docker web service built from ./Dockerfile and a managed
# PostgreSQL database. The DB connection is wired to the app via DATABASE_URL
# (which config/database.php honors for the pgsql connection).
#
# First deploy needs NO manually-set secrets: APP_KEY is generated, the DB is
# wired automatically via DATABASE_URL, mail uses the 'log' mailer, and APP_URL
# has a sensible default. The chat agent runs in deterministic mode with no
# OpenRouter key.
#
# Optional, set later in the Render dashboard when you have them:
#   - OPENROUTER_API_KEY  -> enables LLM phrasing + layer-3 crisis classifier
#   - APP_URL             -> set to the real Render URL for correct absolute links
#   - MAIL_* (+ MAIL_MAILER=smtp) -> enables real outgoing email

databases:
  - name: mentea-db
    databaseName: mentea
    user: mentea
    plan: free

services:
  - type: web
    name: mentea-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # Laravel core
      - key: APP_NAME
        value: Mentea
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      # APP_URL: a non-blocking default so the first deploy does not require it.
      # After Render assigns the public URL (e.g. https://mentea-web.onrender.com)
      # set it here in the dashboard and redeploy so generated links/emails are
      # correct. Leaving the default only affects absolute-link generation.
      - key: APP_URL
        value: https://mentea-web.onrender.com

      # Logging
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      # Drivers (backed by the database)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Database (PostgreSQL). Only DATABASE_URL is wired here; config/database.php
      # reads it natively for the pgsql connection, so the discrete DB_HOST/
      # DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD vars are not needed.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: mentea-db
          property: connectionString

      # HTTPS enforcement
      - key: MENTEA_FORCE_HTTPS
        value: "true"

      # Mail: first deploy uses the 'log' mailer so NO SMTP credentials are
      # required and nothing can fail for lack of mail config (outgoing mail is
      # written to the log instead of being sent). This keeps account
      # verification / password reset / appointment notifications from erroring
      # while you have no mail provider yet.
      #
      # To enable real email later, set MAIL_MAILER=smtp in the Render dashboard
      # and add these variables (Gmail needs an App Password, not your normal
      # password; or use a provider like Resend/Mailgun):
      #   MAIL_HOST, MAIL_PORT=587, MAIL_USERNAME, MAIL_PASSWORD,
      #   MAIL_ENCRYPTION=tls, MAIL_FROM_ADDRESS, MAIL_FROM_NAME
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@mentea.local
      - key: MAIL_FROM_NAME
        value: Mentea

      # Chat agent / OpenRouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CHAT_HISTORY_WINDOW
        value: "12"
      - key: CHAT_HTTP_TIMEOUT
        value: "20"
      - key: CHAT_CRISIS_LINE
        value: "106"
      - key: CHAT_CRISIS_CLASSIFIER
        value: "true"
