name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint (style)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Env + key
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          # sqlite for CI
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env || true
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env

      - name: Migrate
        run: php artisan migrate --force

      - name: NPM build
        run: |
          npm ci || npm install
          npm run build
        continue-on-error: true

      - name: PHPUnit
        run: php artisan test --parallel=0
        continue-on-error: false
